    <div class="dh-conteudo">
        <form class="dh-experiment-log">

    <h2 class="dh-log-title">[ EXPERIMENT LOG ]</h2>
    <div class="dh-log-group">
        <label>SUBJECT ID</label>
        <input type="text" required>
    </div>
    <div class="dh-log-group">
        <label>CATEGORY</label>

        <select>
            <option>C</option>
            <option>JAVA</option>
            <option>HTML</option>
            <option>DESIGN</option>
            <option>CONCEPT</option>
        </select>
    </div>
    <div class="dh-log-group">
        <label>STATUS</label>
        <select>
            <option>ACTIVE</option>
            <option>ARCHIVED</option>
            <option>FAILED</option>
            <option>COMPLETE</option>
        </select>
    </div>
    <div class="dh-log-group">
        <label>OBSERVATIONS</label>
        <textarea required></textarea>
    </div>
    <div class="dh-log-buttons">
        <button type="submit">SAVE LOG</button>
        <button type="reset">CLEAN LOG</button>
    </div>
</form>
